[package]
name = "rapier-examples-2d"
version.workspace = true
authors.workspace = true
edition.workspace = true
default-run = "all_examples2"
publish = false

[features]
parallel = ["rapier2d/parallel", "rapier_testbed2d/parallel", "fracture_rapier/parallel"]
enhanced-determinism = ["rapier2d/enhanced-determinism"]

[dependencies]
# Keep the testbed's shader tooling compatible with the project's current Rust toolchain.
wesl = "=0.4.0"
wesl-macros = "=0.4.0"
wgsl-parse = "=0.4.0"
wgsl-types = "=0.4.0"
anyhow.workspace = true
rand.workspace = true
lyon.workspace = true
dot_vox.workspace = true
kiss3d.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
usvg.workspace = true

[dependencies.rapier_testbed2d]
workspace = true
features = ["fem"]

[dependencies.rapier2d]
workspace = true
features = ["fem"]

[[bin]]
name = "all_examples2"
path = "./all_examples2.rs"

[dependencies.fracture_core]
path = "../crates/fracture_core"

[dependencies.fracture_rapier]
path = "../crates/fracture_rapier"

[dependencies.fracture_voxel]
path = "../crates/fracture_voxel"
